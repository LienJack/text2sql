  <rect x="624" y="238" width="116" height="16" class="edge-label-bg"/>
  <text x="630" y="250" class="edge-label">/api/* + stream</text>

  <path d="M410 338 L700 338" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="548" y="284" width="76" height="16" class="edge-label-bg"/>
  <text x="554" y="296" class="edge-label">REST 调用</text>

