<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <style>
    text {
      font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Microsoft JhengHei", "SimHei", sans-serif;
      fill: #111827;
    }
    .title {
      font-size: 24px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 13px;
      fill: #6b7280;
    }
    .layer {
      fill: #ffffff;
      stroke: #e5e7eb;
      stroke-width: 1.2;
      stroke-dasharray: 6 4;
      rx: 12;
      ry: 12;
    }
    .layer-label {
      font-size: 12px;
      fill: #6b7280;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .node {
      fill: #ffffff;
      stroke: #d1d5db;
      stroke-width: 1.5;
      rx: 10;
      ry: 10;
    }
    .node-title {
      font-size: 15px;
      font-weight: 600;
    }
    .node-sub {
      font-size: 12px;
      fill: #6b7280;
    }
    .accent-blue {
      fill: #eff6ff;
      stroke: #bfdbfe;
    }
    .accent-green {
      fill: #f0fdf4;
      stroke: #bbf7d0;
    }
    .accent-purple {
      fill: #faf5ff;
      stroke: #ddd6fe;
    }
    .accent-orange {
      fill: #fff7ed;
      stroke: #fed7aa;
    }
    .domain {
      fill: #ffffff;
      stroke: #cbd5e1;
      stroke-width: 1.2;
      rx: 8;
      ry: 8;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 600;
    }
    .domain-sub {
      font-size: 11px;
      fill: #64748b;
    }
    .edge-label-bg {
      fill: #ffffff;
      opacity: 0.96;
      rx: 4;
      ry: 4;
    }
    .edge-label {
      font-size: 11px;
      fill: #374151;
      font-weight: 500;
    }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#ffffff"/>

  <text x="40" y="44" class="title">text2sql 系统架构图（扁平图标风）</text>
  <text x="40" y="68" class="subtitle">统一入口：Nginx :3000；应用层：Next.js :3001 + NestJS :3002；后端四域：conversation / governance / knowledge / platform</text>

  <rect x="40" y="92" width="1120" height="116" class="layer"/>
  <text x="56" y="112" class="layer-label">ACCESS LAYER</text>
  <rect x="40" y="230" width="1120" height="250" class="layer"/>
  <text x="56" y="250" class="layer-label">APPLICATION LAYER</text>
  <rect x="40" y="502" width="1120" height="212" class="layer"/>
  <text x="56" y="522" class="layer-label">DATA / INTEGRATION LAYER</text>

  <!-- User Browser -->
  <rect x="80" y="118" width="220" height="74" class="node"/>
  <rect x="94" y="132" width="44" height="44" rx="8" ry="8" class="accent-blue"/>
  <rect x="103" y="141" width="26" height="20" rx="4" ry="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.3"/>
  <circle cx="108" cy="145" r="1.7" fill="#93c5fd"/>
  <circle cx="114" cy="145" r="1.7" fill="#93c5fd"/>
  <circle cx="120" cy="145" r="1.7" fill="#93c5fd"/>
  <text x="150" y="149" class="node-title">用户浏览器</text>
  <text x="150" y="170" class="node-sub">入口：http://localhost:3000</text>

  <!-- Nginx Gateway -->
  <rect x="420" y="110" width="280" height="90" class="node"/>
  <rect x="436" y="133" width="52" height="44" rx="8" ry="8" class="accent-green"/>
  <path d="M449 155 L462 143 L475 155" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M449 150 L462 162 L475 150" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="500" y="145" class="node-title">Nginx Dev Gateway</text>
  <text x="500" y="166" class="node-sub">/ -&gt; Frontend :3001</text>
  <text x="500" y="183" class="node-sub">/api/* -&gt; Backend :3002（含 SSE）</text>

  <!-- Frontend -->
  <rect x="110" y="276" width="300" height="124" class="node"/>
  <rect x="126" y="294" width="52" height="50" rx="8" ry="8" class="accent-blue"/>
  <rect x="136" y="304" width="32" height="28" rx="4" ry="4" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <path d="M140 334 L164 334" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="190" y="315" class="node-title">Frontend（Next.js）</text>
  <text x="190" y="336" class="node-sub">聊天 UI / 数据源管理 / 权限配置</text>
  <text x="190" y="355" class="node-sub">Tailwind v4 + shadcn + assistant-ui</text>

  <!-- Shared Types -->
  <rect x="444" y="300" width="208" height="76" class="node"/>
  <rect x="458" y="316" width="40" height="40" rx="8" ry="8" class="accent-orange"/>
  <text x="470" y="340" font-size="15" font-weight="700" fill="#f97316">{}</text>
  <text x="510" y="329" class="node-title">packages/shared-types</text>
  <text x="510" y="348" class="node-sub">前后端合同与事件类型</text>

