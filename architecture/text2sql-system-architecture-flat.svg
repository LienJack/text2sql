  <rect x="700" y="246" width="430" height="224" class="node"/>
  <rect x="716" y="264" width="56" height="54" rx="8" ry="8" class="accent-purple"/>
  <rect x="726" y="278" width="36" height="28" rx="6" ry="6" fill="#ffffff" stroke="#a78bfa" stroke-width="1.3"/>
  <text x="790" y="284" class="node-title">Backend（NestJS + Prisma + LangGraph）</text>
  <text x="790" y="304" class="node-sub">API / Agent Runtime / Stream / Tool Calling</text>

  <!-- Backend domains -->
  <rect x="724" y="328" width="184" height="58" class="domain"/>
  <text x="736" y="350" class="domain-title">conversation</text>
  <text x="736" y="368" class="domain-sub">会话、编排、SQL 执行链</text>

  <rect x="922" y="328" width="184" height="58" class="domain"/>
  <text x="934" y="350" class="domain-title">governance</text>
  <text x="934" y="368" class="domain-sub">workspace / table-permissions</text>

  <rect x="724" y="398" width="184" height="58" class="domain"/>
  <text x="736" y="420" class="domain-title">knowledge</text>
  <text x="736" y="438" class="domain-sub">RAG / memory / glossary</text>

  <rect x="922" y="398" width="184" height="58" class="domain"/>
  <text x="934" y="420" class="domain-title">platform</text>
  <text x="934" y="438" class="domain-sub">llm / data / observability</text>

