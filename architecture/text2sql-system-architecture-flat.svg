  <text x="140" y="630" class="node-sub">端口 5432</text>

  <rect x="332" y="550" width="220" height="128" class="node"/>
  <rect x="348" y="569" width="52" height="50" rx="8" ry="8" class="accent-green"/>
  <ellipse cx="374" cy="587" rx="16" ry="6.6" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
  <rect x="358" y="587" width="32" height="17" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
  <ellipse cx="374" cy="604" rx="16" ry="6.6" fill="#ffffff" stroke="#34d399" stroke-width="1.2"/>
  <text x="412" y="592" class="node-title">Redis 缓冲</text>
  <text x="412" y="612" class="node-sub">会话同步 / 临时态 / TTL 12h</text>
  <text x="412" y="630" class="node-sub">端口 6379</text>

  <rect x="580" y="550" width="268" height="128" class="node"/>
  <rect x="596" y="569" width="52" height="50" rx="8" ry="8" class="accent-orange"/>
  <rect x="606" y="579" width="32" height="30" rx="4" ry="4" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/>
  <path d="M612 587 L632 587 M612 594 L632 594 M612 601 L632 601" stroke="#fb923c" stroke-width="1.1"/>
  <text x="660" y="592" class="node-title">业务数据源</text>
  <text x="660" y="612" class="node-sub">SQLite / MySQL / PostgreSQL</text>
  <text x="660" y="630" class="node-sub">CSV / Excel 上传后复用</text>

  <rect x="870" y="550" width="290" height="128" class="node"/>
  <rect x="886" y="569" width="52" height="50" rx="8" ry="8" class="accent-purple"/>
  <circle cx="912" cy="594" r="13" fill="#ffffff" stroke="#a78bfa" stroke-width="1.2"/>
  <path d="M903 593 L908 598 L921 585" fill="none" stroke="#8b5cf6" stroke-width="1.8"/>
  <text x="948" y="592" class="node-title">LLM Provider（OpenAI-compatible）</text>
  <text x="948" y="612" class="node-sub">volcengine / siliconflow / minimax</text>
  <text x="948" y="630" class="node-sub">模型推理 + 工具调用</text>

