  <rect x="84" y="587" width="36" height="20" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
  <ellipse cx="102" cy="607" rx="18" ry="7" fill="#ffffff" stroke="#60a5fa" stroke-width="1.2"/>
