  <path d="M958 470 L958 550" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="902" y="504" width="108" height="16" class="edge-label-bg"/>
  <text x="908" y="516" class="edge-label">SQL 安全执行链路</text>

  <path d="M1066 470 L1066 550" fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="1002" y="504" width="118" height="16" class="edge-label-bg"/>
  <text x="1008" y="516" class="edge-label">LLM / Tool Calling</text>

