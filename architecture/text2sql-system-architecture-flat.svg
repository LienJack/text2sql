  <line x1="410" y1="707" x2="446" y2="707" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="452" y="711" class="node-sub">模型与工具流</text>
  <line x1="110" y1="727" x2="146" y2="727" stroke="#6b7280" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrow-gray)"/>
  <text x="152" y="731" class="node-sub">流式/异步回传</text>

  <text x="1160" y="744" text-anchor="end" class="subtitle">generated for text2sql @ 2026-04-20</text>
