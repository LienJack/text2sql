name: frontend-quality

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - "packages/shared-types/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-quality.yml"
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - "packages/shared-types/**"
      - "pnpm-lock.yaml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend lint
        run: pnpm --filter @text2sql/frontend lint

      - name: Frontend test
        run: pnpm --filter @text2sql/frontend test

      - name: Frontend build
        run: pnpm --filter @text2sql/frontend build
