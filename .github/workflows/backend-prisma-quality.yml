name: backend-prisma-quality

on:
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/shared-types/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "scripts/check-backend-capability-boundaries.ts"
      - ".github/workflows/backend-prisma-quality.yml"
  push:
    branches:
      - main
    paths:
      - "apps/backend/**"
      - "packages/shared-types/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "scripts/check-backend-capability-boundaries.ts"
      - ".github/workflows/backend-prisma-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/text2sql_ci
      SQLITE_PATH: data/sqlite/text2sql.db
      REDIS_URL: ""
      LLM_PROVIDER: volcengine
      LLM_MOCK_MODE: "true"
      LANGSMITH_TRACING: "false"
      PORT: "3100"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PNPM
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @text2sql/backend run prisma:generate

      - name: Backend lint
        run: pnpm --filter @text2sql/backend run lint

      - name: Backend capability boundary check
        run: pnpm run backend:capability-boundary:check

      - name: Backend build
        run: pnpm --filter @text2sql/backend run build

      - name: Backend test
        run: pnpm --filter @text2sql/backend run test

      - name: R6 scenario package tests
        env:
          R6_REPORT_DIR: /tmp/r6-evidence
          RELEASE_CANDIDATE: r6-${{ github.sha }}
        run: |
          pnpm --filter @text2sql/backend run test -- \
            test/perf/rag-r6-mixed-load.spec.ts \
            test/integration/r6-evidence-pipeline.spec.ts
          pnpm --filter @text2sql/backend exec jest --config ./test/jest-e2e.json --testRegex "e2e/r6-release-rollback-rehearsal\\.e2e-spec\\.ts$"

      - name: Collect R6 release evidence (fail-fast)
        env:
          R6_REPORT_DIR: /tmp/r6-evidence
          R6_EVIDENCE_ARCHIVE_DIR: /tmp/r6-evidence-archive
          RELEASE_CANDIDATE: r6-${{ github.sha }}
        run: pnpm --filter @text2sql/backend exec node scripts/collect-r6-evidence.mjs

      - name: Upload R6 release evidence archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r6-release-evidence-${{ github.run_id }}
          path: |
            /tmp/r6-evidence
            /tmp/r6-evidence-archive
          if-no-files-found: warn

      - name: Stage1 gate report
        run: pnpm --filter @text2sql/backend exec jest test/e2e/stage1-acceptance.spec.ts --runInBand
        env:
          STAGE1_GATE_REPORT_PATH: /tmp/stage1-gate-report.json
          R1_GATE_MIN_PASS_RATE: "1"
          R1_GATE_MAX_HARD_FAILURE_RATE: "0"
          R1_GATE_MAX_POLICY_REJECTION_RATE: "0.2"
          R1_GATE_MIN_SAMPLES: "10"

      - name: Validate stage1 gate
        run: |
          test -f /tmp/stage1-gate-report.json
          cat /tmp/stage1-gate-report.json
          jq -e '.sampleReady == true' /tmp/stage1-gate-report.json
          jq -e '.gatePass == true' /tmp/stage1-gate-report.json

      - name: Verify empty database migration replay
        run: pnpm --filter @text2sql/backend run prisma:verify-empty-db

      - name: Start backend
        run: |
          pnpm --filter @text2sql/backend run start > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: Health and API smoke
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done

          jq -e '.status == "success"' /tmp/health.json
          jq -e '.data.dependencies.postgres.configured == true' /tmp/health.json

          session_json=$(curl -sS -X POST http://127.0.0.1:3100/api/v1/sessions \
            -H "content-type: application/json" \
            -d '{"datasource":"sqlite_main"}')
          echo "$session_json"
          echo "$session_json" | jq -e '.status == "success"'

          session_id=$(echo "$session_json" | jq -r '.data.id')
          test -n "$session_id"
          test "$session_id" != "null"

          run_json=$(curl -sS -X POST "http://127.0.0.1:3100/api/v1/sessions/$session_id/messages" \
            -H "content-type: application/json" \
            -d '{"message":"统计订单状态分布"}')
          echo "$run_json" | jq -e '.status == "success"'
          echo "$run_json" | jq -e '.data.kind == "agent-run"'

          settings_json=$(curl -sS "http://127.0.0.1:3100/api/v1/settings/models" \
            -H "x-user-role: admin" \
            -H "x-user-id: ci-admin")
          echo "$settings_json" | jq -e '.status == "success"'

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill "$(cat /tmp/backend.pid)" || true
          fi
          if [ -f /tmp/backend.log ]; then
            tail -n 200 /tmp/backend.log
          fi
